name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      users:
        description: Usuarios por escenario en la prueba de carga
        default: '100'

jobs:
  build:
    name: Compilar y tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Tests unitarios y de integración
        run: mvn -B -ntp verify

  load-test:
    name: Prueba de carga con Gatling
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Empaquetar
        run: mvn -B -ntp -DskipTests package

      - name: Arrancar la aplicación
        run: |
          nohup java -jar target/gatling-tutorial-*.jar > app.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8023/characters/randoms/1 > /dev/null && exit 0
            sleep 1
          done
          echo "La aplicación no ha arrancado" && cat app.log && exit 1

      - name: Lanzar la simulación
        run: mvn -B -ntp gatling:test -Dusers=${{ github.event.inputs.users || '100' }} -DrampSeconds=10

      - name: Publicar el informe de Gatling
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informe-gatling
          path: target/gatling/
          if-no-files-found: ignore
